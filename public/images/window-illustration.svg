<svg width="800" height="1000" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000">
  <defs>
    <linearGradient id="wood" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B6F47"/>
      <stop offset="50%" stop-color="#A0826D"/>
      <stop offset="100%" stop-color="#6B5449"/>
    </linearGradient>
    <linearGradient id="glass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#B8D4E8" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#8FB8D4" stop-opacity="0.4"/>
    </linearGradient>
    <pattern id="woodGrain" width="100" height="100" patternUnits="userSpaceOnUse">
      <rect width="100" height="100" fill="url(#wood)"/>
      <path d="M0,20 Q25,15 50,20 T100,20" stroke="#6B5449" stroke-width="0.5" fill="none" opacity="0.3"/>
      <path d="M0,40 Q25,35 50,40 T100,40" stroke="#6B5449" stroke-width="0.5" fill="none" opacity="0.3"/>
      <path d="M0,60 Q25,55 50,60 T100,60" stroke="#6B5449" stroke-width="0.5" fill="none" opacity="0.3"/>
      <path d="M0,80 Q25,75 50,80 T100,80" stroke="#6B5449" stroke-width="0.5" fill="none" opacity="0.3"/>
    </pattern>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="1000" fill="#F5F0E8"/>
  
  <!-- Window Frame -->
  <rect x="100" y="100" width="600" height="800" fill="url(#woodGrain)" stroke="#5A4A3A" stroke-width="8"/>
  
  <!-- Window Panes -->
  <rect x="140" y="140" width="240" height="340" fill="url(#glass)" stroke="#5A4A3A" stroke-width="6"/>
  <rect x="420" y="140" width="240" height="340" fill="url(#glass)" stroke="#5A4A3A" stroke-width="6"/>
  <rect x="140" y="520" width="240" height="340" fill="url(#glass)" stroke="#5A4A3A" stroke-width="6"/>
  <rect x="420" y="520" width="240" height="340" fill="url(#glass)" stroke="#5A4A3A" stroke-width="6"/>
  
  <!-- Mullions -->
  <line x1="260" y1="140" x2="260" y2="480" stroke="#5A4A3A" stroke-width="4"/>
  <line x1="140" y1="310" x2="380" y2="310" stroke="#5A4A3A" stroke-width="4"/>
  <line x1="540" y1="140" x2="540" y2="480" stroke="#5A4A3A" stroke-width="4"/>
  <line x1="420" y1="310" x2="660" y2="310" stroke="#5A4A3A" stroke-width="4"/>
  <line x1="260" y1="520" x2="260" y2="860" stroke="#5A4A3A" stroke-width="4"/>
  <line x1="140" y1="690" x2="380" y2="690" stroke="#5A4A3A" stroke-width="4"/>
  <line x1="540" y1="520" x2="540" y2="860" stroke="#5A4A3A" stroke-width="4"/>
  <line x1="420" y1="690" x2="660" y2="690" stroke="#5A4A3A" stroke-width="4"/>
  
  <!-- Decorative Elements -->
  <rect x="120" y="120" width="560" height="20" fill="#6B5449" opacity="0.5"/>
  <rect x="120" y="860" width="560" height="20" fill="#6B5449" opacity="0.5"/>
  
  <!-- Hardware -->
  <circle cx="370" cy="490" r="8" fill="#C8962E" stroke="#9A7220" stroke-width="2"/>
  <circle cx="430" cy="490" r="8" fill="#C8962E" stroke="#9A7220" stroke-width="2"/>
  <circle cx="370" cy="510" r="8" fill="#C8962E" stroke="#9A7220" stroke-width="2"/>
  <circle cx="430" cy="510" r="8" fill="#C8962E" stroke="#9A7220" stroke-width="2"/>
</svg>
