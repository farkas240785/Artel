<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800">
  <defs>
    <linearGradient id="wood" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B6F47"/>
      <stop offset="50%" stop-color="#A0826D"/>
      <stop offset="100%" stop-color="#6B5449"/>
    </linearGradient>
    <pattern id="woodGrain" width="100" height="100" patternUnits="userSpaceOnUse">
      <rect width="100" height="100" fill="url(#wood)"/>
      <path d="M0,20 Q25,15 50,20 T100,20" stroke="#6B5449" stroke-width="0.5" fill="none" opacity="0.3"/>
      <path d="M0,40 Q25,35 50,40 T100,40" stroke="#6B5449" stroke-width="0.5" fill="none" opacity="0.3"/>
      <path d="M0,60 Q25,55 50,60 T100,60" stroke="#6B5449" stroke-width="0.5" fill="none" opacity="0.3"/>
      <path d="M0,80 Q25,75 50,80 T100,80" stroke="#6B5449" stroke-width="0.5" fill="none" opacity="0.3"/>
    </pattern>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="800" fill="#F5F0E8"/>
  
  <!-- Workshop Table -->
  <rect x="100" y="400" width="1000" height="300" fill="#6B5449" opacity="0.8"/>
  <rect x="100" y="400" width="1000" height="20" fill="#5A4A3A"/>
  
  <!-- Tools on table -->
  <!-- Chisel -->
  <rect x="200" y="450" width="15" height="120" fill="url(#woodGrain)" rx="2"/>
  <polygon points="200,570 215,570 207.5,590" fill="#888"/>
  
  <!-- Plane -->
  <rect x="350" y="480" width="150" height="60" fill="url(#woodGrain)" rx="5"/>
  <rect x="380" y="460" width="40" height="20" fill="#6B5449" rx="3"/>
  <rect x="350" y="540" width="150" height="8" fill="#5A4A3A"/>
  
  <!-- Hammer -->
  <rect x="600" y="470" width="12" height="100" fill="url(#woodGrain)" rx="2"/>
  <rect x="580" y="450" width="52" height="30" fill="#777" rx="3"/>
  
  <!-- Ruler -->
  <rect x="750" y="500" width="200" height="15" fill="#C8962E" opacity="0.8"/>
  <line x1="760" y1="500" x2="760" y2="515" stroke="#9A7220" stroke-width="1"/>
  <line x1="780" y1="500" x2="780" y2="510" stroke="#9A7220" stroke-width="1"/>
  <line x1="800" y1="500" x2="800" y2="515" stroke="#9A7220" stroke-width="1"/>
  <line x1="820" y1="500" x2="820" y2="510" stroke="#9A7220" stroke-width="1"/>
  <line x1="840" y1="500" x2="840" y2="515" stroke="#9A7220" stroke-width="1"/>
  
  <!-- Wood pieces -->
  <rect x="250" y="620" width="180" height="40" fill="url(#woodGrain)" rx="3"/>
  <rect x="500" y="640" width="120" height="30" fill="url(#woodGrain)" rx="3"/>
  <rect x="700" y="610" width="200" height="50" fill="url(#woodGrain)" rx="3"/>
  
  <!-- Decorative elements -->
  <circle cx="150" cy="300" r="40" fill="#C8962E" opacity="0.2"/>
  <circle cx="1050" cy="350" r="50" fill="#2D5A3D" opacity="0.15"/>
</svg>
